name: Build Electron App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Mac-App bauen
        run: npx electron-builder --mac --publish never

      - name: Mac-Dateien hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Unterrichtszeitplan-Mac
          path: dist/

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Windows-App bauen
        run: npx electron-builder --win --x64 --publish never

      - name: Windows-Dateien hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Unterrichtszeitplan-Windows
          path: dist/
